<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mini Paint Pro</title>
    <!-- Actividad 10: Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <!-- Vinculación CSS global -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>Mini Paint Pro</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="portfolio.html">Portafolio</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">
        <section>
            <h2>Contacto</h2>
            <form id="contactForm">
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" required></textarea>
                </div>
                <button type="submit">Enviar Mensaje</button>
            </form>
            <p id="mensajeExito" class="mensaje-exito">¡Mensaje enviado con éxito!</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mini Paint Pro - Proyecto Estudiantil</p>
    </footer>

    <!-- Vinculación JavaScript específica de la página -->
    <script src="javascript/contacto.js"></script>
</body>
</html>
