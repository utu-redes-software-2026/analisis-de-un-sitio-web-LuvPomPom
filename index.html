<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Paint Pro - Proyecto Integrador</title>
    <!-- Actividad 10: Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <!-- Vinculación CSS -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <div class="logo">
            <!-- Actividad 1: Nombre de la app o marca -->
            <h1>Mini Paint Pro</h1>
        </div>
        <!-- Enlaces requeridos en el punto 2 y Actividad 3 -->
        <nav>
            <ul>
                <li><a href="index.html" class="active">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="portfolio.html">Portafolio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="paint-container">
            <div class="toolbar">
                <div class="tool-group">
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    <button onclick="document.getElementById('fileInput').click()">Abrir Imagen</button>
                    <button id="saveBtn">Guardar</button>
                </div>

                <div class="tool-group">
                    <button id="toolPencil" class="active">Pincel</button>
                    <button id="toolEraser">Borrador</button>
                    <button id="toolFill">Rellenar</button>
                    <select id="shapeSelect">
                        <option value="none">Libre</option>
                        <option value="line">Línea</option>
                        <option value="rect">Rectángulo</option>
                        <option value="circle">Círculo</option>
                    </select>
                </div>

                <div class="tool-group">
                    <label>Color: <input type="color" id="colorPicker" value="#000000"></label>
                    <div class="color-palette">
                        <button class="color-btn" style="background: #000000;" onclick="setColor('#000000')"></button>
                        <button class="color-btn" style="background: #ff0000;" onclick="setColor('#ff0000')"></button>
                        <button class="color-btn" style="background: #00ff00;" onclick="setColor('#00ff00')"></button>
                        <button class="color-btn" style="background: #0000ff;" onclick="setColor('#0000ff')"></button>
                        <button class="color-btn" style="background: #ffff00;" onclick="setColor('#ffff00')"></button>
                    </div>
                </div>

                <div class="tool-group">
                    <label>Grosor: <input type="range" id="brushSize" min="1" max="50" value="5"></label>
                    <label>Opacidad: <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="1"></label>
                </div>

                <div class="tool-group">
                    <button id="clearBtn" class="clear">Limpiar Todo</button>
                </div>
            </div>

            <canvas id="paintCanvas" width="700" height="500"></canvas>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mini Paint Pro - Proyecto Estudiantil</p>
    </footer>

    <!-- Vinculación JavaScript -->
    <script src="javascript/paint.js"></script>
</body>
</html>
